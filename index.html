<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLO — Training</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#1f1f1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:38px 28px;box-shadow:0 14px 40px rgba(0,0,0,.07);text-align:center}.logo{font:600 44px Georgia,serif;letter-spacing:12px;margin-left:12px}.tag{font-size:10px;letter-spacing:1.7px;margin:10px 0 28px;color:#777}.line{height:1px;background:#dedbd4;margin-bottom:28px}.title{font:500 22px Georgia,serif;margin:0 0 20px}input{width:100%;padding:15px 16px;border:1px solid #d8d5cf;border-radius:12px;margin:7px 0;font-size:16px;background:#faf9f6}.btn{display:block;width:100%;border:0;border-radius:12px;background:#202020;color:#fff;padding:15px;margin-top:14px;font-size:16px;cursor:pointer}.note{font-size:12px;color:#999;margin-top:20px}
</style>
</head>
<body><div class="wrap"><main class="card"><div class="logo">FLO</div><div class="tag">FOOD LOVERS ONLY · СДЕЛАНО В ПЕТЕРБУРГЕ</div><div class="line"></div><h1 class="title">Обучение и стандарты</h1><form onsubmit="event.preventDefault(); const l=this.login.value.trim(),p=this.password.value; if(l==='admin'&&p==='2026'){document.querySelector('.title').textContent='Администратор';this.innerHTML='<button class=\"btn\" type=\"button\">Сотрудники</button><button class=\"btn\" type=\"button\">Материалы</button><button class=\"btn\" type=\"button\">Тесты</button>'}else{alert('Неверный логин или пароль')}"><input name="login" placeholder="Логин" autocomplete="username" required><input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="btn">Войти</button></form><div class="note">FLO · внутренняя система</div></main></div></body>
</html>
